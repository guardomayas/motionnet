basis:
  kind: raised_cosine
  nbasis: 8
  RFstart_s: 0.015
  RFend_s: 0.130
  b: 0.02
  zflag: 0

model:
  rf_size_1: 5
  rf_size_2: 5
  num_subunits_1: 10
  num_subunits_2: 8
  out_gain: 1.0
  initial_threshold: 0.0
  initial_gain: 1.0
  input_noise_std: 0.0     # 0.10 * sqrt(fps/75)
  layer_noise_std: 0.0

loss:
  lambda_sp: 0.0
  lambda_t: 0.0
  lambda_1: 0.0
  lambda_2: 0.04
  warmup_epochs: 50

optim:
  seed: 1
  epochs: 400
  lr: 3.0e-3
  eta_min: 1.0e-4
  batch_size: 32
  grad_clip: 1.0
  weight_decay: 0.0