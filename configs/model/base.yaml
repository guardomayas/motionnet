model:
  rf_size_1: 7
  rf_size_2: 5
  num_subunits_1: 5
  num_subunits_2: 8
  out_gain: 1.0
  initial_threshold: 0.0
  initial_gain: 1.0
  nonlinearity: relu
  # noise
  noise_f_ref: 75.0        # Hz; input noise level is defined at this rate
  input_noise_std: 0.10    # at noise_f_ref; model scales by sqrt(fps/f_ref) -> 0.141 at 150 Hz (20 dB)
  layer_noise_std: 0.10    # layer 1, additive, per frame (not rate-scaled)
  layer2_noise_std: 0.0    # layer 2, multiplicative, per frame; off in base, swept in experiments
  readout_bias: true
  zero_dc2: false
loss:
  gamma_var: 0.5
  lambda_r1: 0.0           # L1 rate after the nonlinearity, layer 1 (Karklin–Simoncelli)
  lambda_r2: 0.0           # same, layer 2
  lambda_sp: 0.01
  warmup_epochs: 12

optim:
  seed: 0
  epochs: 150
  lr: 3.0e-3
  eta_min: 1.0e-4
  batch_size: 32
  grad_clip: 1.0
  weight_decay: 0.0