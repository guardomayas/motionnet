[project]
name = "motionnet"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "einops",
    "hydra-core",
    "wandb",
    "h5py",
    "matplotlib",
    "seaborn",
    "scipy",
    "tqdm" 
]

[project.optional-dependencies]
cpu = ["torch>=2.4,<2.5", "torchvision", "imageio", "pooch"]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel>=7.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motionnet"]